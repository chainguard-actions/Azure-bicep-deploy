name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests-unit:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies Common
        id: npm-install-common
        working-directory: ./packages/bicep-deploy-common
        run: npm ci

      - name: Build bicep-deploy-common Package
        id: build
        working-directory: ./packages/bicep-deploy-common
        run: |
          rm -Rf dist
          npm run build

      - name: Install Dependencies
        id: npm-install
        run: npm ci

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-test
        run: npm run test

  check-access:
    name: Check Secrets Access
    runs-on: ubuntu-latest
    outputs:
      access_verified: ${{ steps.check-access.outputs.verified && !(github.event_name == 'workflow_dispatch' && github.ref != 'refs/head/main') }}

    steps:
      - id: check-access
        if: env.SECRET_TO_CHECK != ''
        run: echo 'verified=true' >> $GITHUB_OUTPUT
        env:
          SECRET_TO_CHECK: ${{ secrets.SECRET_TO_CHECK }}

  tests-live:
    permissions:
      contents: read
      id-token: write

    if: needs.check-access.outputs.access_verified == 'true'
    needs:
      - check-access

    name: Live Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies Common
        id: npm-install-common
        working-directory: ./packages/bicep-deploy-common
        run: npm ci

      - name: Build bicep-deploy-common Package
        id: build
        working-directory: ./packages/bicep-deploy-common
        run: |
          rm -Rf dist
          npm run build

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run Live Tests
        run: npm run test:live
        env:
          LIVETEST_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          LIVETEST_RESOURCE_GROUP: azure-bicep-deploy-ci

  tests-action:
    permissions:
      contents: read
      id-token: write

    if: needs.check-access.outputs.access_verified == 'true'
    needs:
      - check-access

    name: Actions Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    concurrency:
      # Stacks are stateful - avoid modifying the same Stack concurrently
      group: ${{ matrix.os }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Test Deployment - Validate
        uses: ./
        with:
          type: deployment
          operation: validate
          name: ci-deploy-${{ matrix.os }}
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: azure-bicep-deploy-ci
          parameters-file: test/files/basic/main.bicepparam

      - name: Test Deployment - WhatIf
        uses: ./
        with:
          type: deployment
          operation: whatIf
          name: ci-deploy-${{ matrix.os }}
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: azure-bicep-deploy-ci
          parameters-file: test/files/basic/main.bicepparam

      - name: Test Deployment - Deploy
        id: test-deployment-create
        uses: ./
        with:
          type: deployment
          operation: create
          name: ci-deploy-${{ matrix.os }}
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: azure-bicep-deploy-ci
          parameters-file: test/files/basic/main.bicepparam

      - name: Verify Deployment Outputs
        shell: bash
        env:
          INT_OUTPUT: ${{ steps.test-deployment-create.outputs.intOutput }}
          STRING_OUTPUT: ${{ steps.test-deployment-create.outputs.stringOutput }}
        run: |
          [ "$INT_OUTPUT" = "42" ] || exit 1
          [ "$STRING_OUTPUT" = "hello world" ] || exit 1

      - name: Test Local Action (Stack)
        id: test-stack-create
        uses: ./
        with:
          type: deploymentStack
          operation: create
          name: ci-stack-${{ matrix.os }}
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: azure-bicep-deploy-ci
          parameters-file: test/files/basic/main.bicepparam
          action-on-unmanage-resources: delete
          deny-settings-mode: denyDelete

      - name: Verify Stack Outputs
        shell: bash
        env:
          INT_OUTPUT: ${{ steps.test-stack-create.outputs.intOutput }}
          STRING_OUTPUT: ${{ steps.test-stack-create.outputs.stringOutput }}
        run: |
          [ "$INT_OUTPUT" = "42" ] || exit 1
          [ "$STRING_OUTPUT" = "hello world" ] || exit 1
