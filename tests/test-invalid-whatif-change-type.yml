name: Test invalid what-if-exclude-change-types input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          type: deployment
          operation: whatIf
          scope: resourceGroup
          subscription-id: fake-sub-id
          resource-group-name: fake-rg
          what-if-exclude-change-types: invalidChangeType
      - name: Assert action failed with enum error for what-if-exclude-change-types
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid what-if-exclude-change-types, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid what-if-exclude-change-types"
