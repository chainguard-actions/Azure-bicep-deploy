name: Test missing subscription-id for subscription scope
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          type: deployment
          operation: create
          scope: subscription
          # subscription-id intentionally omitted to trigger required input error
      - name: Assert action failed due to missing subscription-id
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when subscription-id is missing for subscription scope, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for missing subscription-id"
