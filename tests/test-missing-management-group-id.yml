name: Test missing management-group-id for managementGroup scope
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          type: "deployment"
          operation: "create"
          scope: "managementGroup"
          location: "eastus"
          # management-group-id intentionally omitted — should fail with a required input error
      - name: Assert action failed due to missing management-group-id
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when management-group-id is missing for managementGroup scope, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when management-group-id was not provided for managementGroup scope"
