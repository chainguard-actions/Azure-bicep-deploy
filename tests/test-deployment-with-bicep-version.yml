name: Test deployment validate with specific bicep version
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal Bicep template
        run: |
          mkdir -p /tmp/bicep-version-test
          cat > /tmp/bicep-version-test/main.bicep << 'EOF'
          targetScope = 'resourceGroup'

          param location string = resourceGroup().location

          output deployedLocation string = location
          EOF

      - name: Run deployment validate with specific bicep version (expect failure - no Azure credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          type: deployment
          operation: validate
          scope: resourceGroup
          name: test-versioned-deployment
          subscription-id: 00000000-0000-0000-0000-000000000000
          resource-group-name: test-rg
          location: eastus
          template-file: /tmp/bicep-version-test/main.bicep
          bicep-version: '0.38.5'

      - name: Assert action ran (expected to fail without Azure credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
