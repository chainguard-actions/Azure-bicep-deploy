name: Test deployment validate at management group scope
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal management-group-scope Bicep template
        run: |
          mkdir -p /tmp/bicep-mg-test
          cat > /tmp/bicep-mg-test/mg.bicep << 'EOF'
          targetScope = 'managementGroup'

          param location string = 'eastus'

          output deployedLocation string = location
          EOF

      - name: Run deployment validate at management group scope (expect failure - no Azure credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          type: deployment
          operation: validate
          scope: managementGroup
          name: test-mg-deployment
          management-group-id: test-mg-id
          location: eastus
          template-file: /tmp/bicep-mg-test/mg.bicep

      - name: Assert action ran (expected to fail without Azure credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
