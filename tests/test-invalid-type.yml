name: Test invalid type input is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          type: notAType
          operation: create
          scope: resourceGroup
          subscription-id: 00000000-0000-0000-0000-000000000000
          resource-group-name: rg-test
      - name: Assert action failed on invalid type
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid 'type'"
            exit 1
          fi
          echo "PASS"
      - name: Assert error message (direct invocation of shipped dist)
        run: |
          if ! command -v node >/dev/null 2>&1 || ! node -e 'process.exit(parseInt(process.versions.node)>=20?0:1)'; then
            echo "SKIP: suitable node not available"
            exit 0
          fi
          set +e
          out=$(env -i PATH="$PATH" HOME="$HOME" \
            "INPUT_TYPE=notAType" "INPUT_OPERATION=create" "INPUT_SCOPE=resourceGroup" \
            node "$GITHUB_WORKSPACE/dist/index.cjs" 2>&1)
          rc=$?
          set -e
          echo "$out"
          echo "rc: $rc"
          if [ "$rc" -eq 0 ]; then echo "FAIL: expected non-zero exit"; exit 1; fi
          if ! echo "$out" | grep -q "Input 'type' must be one of the following values: 'deployment', 'deploymentStack'"; then
            echo "FAIL: expected enum error for 'type'"
            exit 1
          fi
          echo "PASS"
