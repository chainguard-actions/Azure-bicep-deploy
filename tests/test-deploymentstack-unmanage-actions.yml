name: Test deploymentStack with unmanage actions and bypass-stack-out-of-sync-error inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal ARM template file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/stack-unmanage-main.json" <<'EOF'
          {
            "$schema": "https://schema.management.azure.com/schemas/2018-05-01/subscriptionDeploymentTemplate.json#",
            "contentVersion": "1.0.0.0",
            "resources": []
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          type: "deploymentStack"
          operation: "create"
          scope: "subscription"
          subscription-id: "00000000-0000-0000-0000-000000000000"
          location: "eastus"
          template-file: "tests/fixtures/stack-unmanage-main.json"
          action-on-unmanage-resources: "detach"
          action-on-unmanage-resourcegroups: "detach"
          action-on-unmanage-managementgroup: "detach"
          deny-settings-mode: "none"
          bypass-stack-out-of-sync-error: "true"
          name: "test-stack-unmanage"
      - name: Assert action failed gracefully (no Azure credentials available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there are no Azure credentials in the test environment.
          # Input validation passes (unmanage action inputs are provided), but the Azure API call fails.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no Azure credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded — Azure credentials should not be available"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
