name: Test unsupported template file type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create an unsupported template file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures"
          echo "this is not a valid template" > "$GITHUB_WORKSPACE/tests/fixtures/template.txt"
      - id: action
        uses: .
        continue-on-error: true
        with:
          type: "deployment"
          operation: "create"
          scope: "resourceGroup"
          subscription-id: "00000000-0000-0000-0000-000000000000"
          resource-group-name: "test-rg"
          template-file: "tests/fixtures/template.txt"
      - name: Assert action failed due to unsupported template file type
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with unsupported template file type, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when given an unsupported template file type"
