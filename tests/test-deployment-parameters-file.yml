name: Test deployment validate with parameters-file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a parameters file
        run: |
          mkdir -p /tmp/bicep-params-file-test
          cat > /tmp/bicep-params-file-test/params.json << 'EOF'
          {
            "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
            "contentVersion": "1.0.0.0",
            "parameters": {
              "location": {
                "value": "eastus"
              }
            }
          }
          EOF

      - name: Run deployment validate with parameters-file (expect failure - no Azure credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          type: deployment
          operation: validate
          scope: resourceGroup
          name: test-params-file-deployment
          subscription-id: 00000000-0000-0000-0000-000000000000
          resource-group-name: test-rg
          template-file: pristine/azure--bicep-deploy/v2.3.0/tests/fixtures/main.bicep
          parameters-file: /tmp/bicep-params-file-test/params.json

      - name: Assert action ran (expected to fail without Azure credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
