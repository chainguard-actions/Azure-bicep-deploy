name: Test deploymentStack missing required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          type: deploymentStack
          operation: create
          scope: resourceGroup
          subscription-id: fake-sub-id
          resource-group-name: fake-rg
          # action-on-unmanage-resources and deny-settings-mode intentionally omitted
      - name: Assert action failed due to missing deploymentStack required inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when deploymentStack required inputs are missing, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for missing deploymentStack required inputs"
