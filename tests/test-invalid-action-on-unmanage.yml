name: Test invalid action-on-unmanage-resources for deploymentStack
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          type: deploymentStack
          operation: create
          scope: resourceGroup
          subscription-id: fake-sub-id
          resource-group-name: fake-rg
          action-on-unmanage-resources: invalidAction
          deny-settings-mode: none
      - name: Assert action failed with enum error for action-on-unmanage-resources
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid action-on-unmanage-resources, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid action-on-unmanage-resources"
