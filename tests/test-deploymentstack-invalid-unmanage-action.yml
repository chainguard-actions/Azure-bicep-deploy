name: Test deploymentStack with invalid action-on-unmanage-resources
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          type: "deploymentStack"
          operation: "create"
          scope: "resourceGroup"
          subscription-id: "00000000-0000-0000-0000-000000000000"
          resource-group-name: "test-rg"
          action-on-unmanage-resources: "invalidAction"
          deny-settings-mode: "none"
          name: "test-stack"
      - name: Assert action failed with invalid action-on-unmanage-resources error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid action-on-unmanage-resources, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when given an invalid action-on-unmanage-resources value"
