name: Test invalid action-on-unmanage-managementgroup is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          type: deploymentStack
          operation: validate
          scope: managementGroup
          management-group-id: mg-test
          location: eastus
          action-on-unmanage-resources: delete
          action-on-unmanage-resourcegroups: delete
          action-on-unmanage-managementgroup: notAnAction
          deny-settings-mode: none
      - name: Assert action failed on invalid action-on-unmanage-managementgroup
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid 'action-on-unmanage-managementgroup'"
            exit 1
          fi
          echo "PASS"
      - name: Assert error message (direct invocation of shipped dist)
        run: |
          if ! command -v node >/dev/null 2>&1 || ! node -e 'process.exit(parseInt(process.versions.node)>=20?0:1)'; then
            echo "SKIP: suitable node not available"
            exit 0
          fi
          set +e
          out=$(env -i PATH="$PATH" HOME="$HOME" \
            "INPUT_TYPE=deploymentStack" "INPUT_OPERATION=validate" "INPUT_SCOPE=managementGroup" \
            "INPUT_MANAGEMENT-GROUP-ID=mg-test" "INPUT_LOCATION=eastus" \
            "INPUT_ACTION-ON-UNMANAGE-RESOURCES=delete" \
            "INPUT_ACTION-ON-UNMANAGE-RESOURCEGROUPS=delete" \
            "INPUT_ACTION-ON-UNMANAGE-MANAGEMENTGROUP=notAnAction" \
            "INPUT_DENY-SETTINGS-MODE=none" \
            node "$GITHUB_WORKSPACE/dist/index.cjs" 2>&1)
          rc=$?
          set -e
          echo "$out"
          echo "rc: $rc"
          if [ "$rc" -eq 0 ]; then echo "FAIL: expected non-zero exit"; exit 1; fi
          if ! echo "$out" | grep -q "Input 'action-on-unmanage-managementgroup' must be one of the following values: 'delete', 'detach'"; then
            echo "FAIL: expected enum error for 'action-on-unmanage-managementgroup'"
            exit 1
          fi
          echo "PASS"
