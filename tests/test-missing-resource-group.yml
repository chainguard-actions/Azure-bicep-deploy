name: Test missing resource-group-name for resourceGroup scope
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          type: deployment
          operation: create
          scope: resourceGroup
          subscription-id: fake-sub-id
          # resource-group-name intentionally omitted to trigger required input error
      - name: Assert action failed due to missing resource-group-name
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when resource-group-name is missing for resourceGroup scope, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for missing resource-group-name"
