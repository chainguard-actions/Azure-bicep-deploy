name: Test resourceGroup scope requires resource-group-name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          type: deployment
          operation: validate
          scope: resourceGroup
          subscription-id: 00000000-0000-0000-0000-000000000000
      - name: Assert action failed on missing resource-group-name
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when resource-group-name is missing"
            exit 1
          fi
          echo "PASS"
      - name: Assert error message (direct invocation of shipped dist)
        run: |
          if ! command -v node >/dev/null 2>&1 || ! node -e 'process.exit(parseInt(process.versions.node)>=20?0:1)'; then
            echo "SKIP: suitable node not available"
            exit 0
          fi
          set +e
          out=$(env -i PATH="$PATH" HOME="$HOME" \
            "INPUT_TYPE=deployment" "INPUT_OPERATION=validate" "INPUT_SCOPE=resourceGroup" \
            "INPUT_SUBSCRIPTION-ID=00000000-0000-0000-0000-000000000000" \
            node "$GITHUB_WORKSPACE/dist/index.cjs" 2>&1)
          rc=$?
          set -e
          echo "$out"
          echo "rc: $rc"
          if [ "$rc" -eq 0 ]; then echo "FAIL: expected non-zero exit"; exit 1; fi
          if ! echo "$out" | grep -q "Input 'resource-group-name' is required but not provided"; then
            echo "FAIL: expected required error for 'resource-group-name'"
            exit 1
          fi
          echo "PASS"
