name: Test deployment validate subscription scope
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action (expect failure - no Azure credentials)
        id: action
        uses: .
        with:
          type: deployment
          operation: validate
          scope: subscription
          subscription-id: 00000000-0000-0000-0000-000000000000
          location: eastus
          template-file: pristine/azure--bicep-deploy/v2.3.0/tests/fixtures/main.bicep
        continue-on-error: true

      - name: Assert action failed (no Azure credentials available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without Azure credentials, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed as expected without Azure credentials"
