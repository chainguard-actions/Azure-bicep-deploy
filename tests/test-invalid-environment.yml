name: Test invalid environment input is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          type: deployment
          operation: validate
          scope: resourceGroup
          name: test-deployment
          subscription-id: 00000000-0000-0000-0000-000000000000
          resource-group-name: rg-test
          template-file: ./main.bicep
          parameters-file: ./main.bicepparam
          masked-outputs: secretOne, secretTwo
          bicep-version: 0.38.5
          environment: notACloud
      - name: Assert action failed on invalid environment
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid 'environment'"
            exit 1
          fi
          echo "PASS"
      - name: Assert error message (direct invocation of shipped dist)
        run: |
          if ! command -v node >/dev/null 2>&1 || ! node -e 'process.exit(parseInt(process.versions.node)>=20?0:1)'; then
            echo "SKIP: suitable node not available"
            exit 0
          fi
          set +e
          out=$(env -i PATH="$PATH" HOME="$HOME" \
            "INPUT_TYPE=deployment" "INPUT_OPERATION=validate" "INPUT_SCOPE=resourceGroup" \
            "INPUT_NAME=test-deployment" \
            "INPUT_SUBSCRIPTION-ID=00000000-0000-0000-0000-000000000000" \
            "INPUT_RESOURCE-GROUP-NAME=rg-test" \
            "INPUT_TEMPLATE-FILE=./main.bicep" "INPUT_PARAMETERS-FILE=./main.bicepparam" \
            "INPUT_MASKED-OUTPUTS=secretOne, secretTwo" "INPUT_BICEP-VERSION=0.38.5" \
            "INPUT_ENVIRONMENT=notACloud" \
            node "$GITHUB_WORKSPACE/dist/index.cjs" 2>&1)
          rc=$?
          set -e
          echo "$out"
          echo "rc: $rc"
          if [ "$rc" -eq 0 ]; then echo "FAIL: expected non-zero exit"; exit 1; fi
          if ! echo "$out" | grep -q "Input 'environment' must be one of the following values: 'azureCloud', 'azureChinaCloud', 'azureGermanCloud', 'azureUSGovernment'"; then
            echo "FAIL: expected enum error for 'environment'"
            exit 1
          fi
          echo "PASS"
