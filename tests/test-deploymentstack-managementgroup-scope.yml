name: Test deploymentStack with managementGroup scope and action-on-unmanage-managementgroup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run deploymentStack validate at managementGroup scope (expect failure - no Azure credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          type: deploymentStack
          operation: validate
          scope: managementGroup
          name: test-mg-stack
          management-group-id: test-mg-id
          location: eastus
          template-file: pristine/azure--bicep-deploy/v2.3.0/tests/fixtures/main.bicep
          action-on-unmanage-resources: detach
          action-on-unmanage-resourcegroups: detach
          action-on-unmanage-managementgroup: detach
          deny-settings-mode: none

      - name: Assert action ran (expected to fail without Azure credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
