name: Test template file not found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          type: "deployment"
          operation: "create"
          scope: "resourceGroup"
          subscription-id: "00000000-0000-0000-0000-000000000000"
          resource-group-name: "test-rg"
          template-file: "nonexistent/path/to/template.json"
      - name: Assert action failed due to missing template file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when template file does not exist, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when template file was not found"
