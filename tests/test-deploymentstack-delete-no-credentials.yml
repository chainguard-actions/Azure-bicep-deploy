name: Test deploymentStack delete fails gracefully without Azure credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          type: "deploymentStack"
          operation: "delete"
          scope: "resourceGroup"
          subscription-id: "00000000-0000-0000-0000-000000000000"
          resource-group-name: "test-rg"
          action-on-unmanage-resources: "detach"
          deny-settings-mode: "none"
          name: "test-stack"
      - name: Assert action failed gracefully (no Azure credentials available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there are no Azure credentials in the test environment.
          # Input validation passes (all required inputs are provided), but the Azure API call fails.
          # Note: delete operation does not require a template file.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no Azure credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded — Azure credentials should not be available"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
